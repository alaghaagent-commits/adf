<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Qualita</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Aref+Ruqaa:wght@400;700&family=Tajawal:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#FAF5F0; --surface:#FFFFFF; --ink:#3E2F35; --ink-soft:#8A7178;
    --rose:#C99BAA; --rose-deep:#9C6B7C; --gold:#BB9964; --line:#EADFD8;
    box-sizing:border-box;
    padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#241C20; --surface:#2E2428; --ink:#F3E9EC; --ink-soft:#C9B7BE;
      --rose:#C99BAA; --rose-deep:#D8AEBB; --gold:#D4B27E; --line:#4A3A40;
    }
  }
  :root[data-theme="dark"]{
    --bg:#241C20; --surface:#2E2428; --ink:#F3E9EC; --ink-soft:#C9B7BE;
    --rose:#C99BAA; --rose-deep:#D8AEBB; --gold:#D4B27E; --line:#4A3A40;
  }
  html{scroll-padding-top:env(safe-area-inset-top,0px); scroll-behavior:smooth;}
  *{box-sizing:border-box;}
  body{margin:0; background:var(--bg); color:var(--ink); font-family:'Tajawal',sans-serif; font-weight:400; overflow-x:hidden;}
  header{
    padding:28px 20px 10px; text-align:center; position:relative;
  }
  .brand{font-family:'Aref Ruqaa',serif; font-size:15px; letter-spacing:1px; color:var(--ink-soft); direction:ltr;}
  h1{font-family:'Aref Ruqaa',serif; font-weight:700; font-size:clamp(28px,6vw,42px); margin:6px 0 4px; color:var(--rose-deep);}
  .sub{color:var(--ink-soft); font-size:14px; max-width:400px; margin:0 auto;}

  .cart-btn{
    position:fixed; top:calc(16px + env(safe-area-inset-top,0px)); left:16px; z-index:40;
    width:52px; height:52px; border-radius:50%; background:var(--surface); border:1px solid var(--line);
    box-shadow:0 4px 14px rgba(0,0,0,.08); display:flex; align-items:center; justify-content:center;
    cursor:pointer;
  }
  .cart-btn svg{width:22px; height:22px; stroke:var(--rose-deep); fill:none; stroke-width:1.6;}
  .cart-count{
    position:absolute; top:-4px; right:-4px; background:var(--rose-deep); color:#fff; font-size:11px;
    min-width:18px; height:18px; border-radius:9px; display:flex; align-items:center; justify-content:center; padding:0 4px;
  }

  .carousel-wrap{ padding:30px 0 10px; display:flex; align-items:center; justify-content:center; gap:14px; }
  .arrow{
    width:40px; height:40px; border-radius:50%; border:1px solid var(--line); background:var(--surface);
    color:var(--rose-deep); font-size:18px; cursor:pointer; flex:0 0 auto;
    display:flex; align-items:center; justify-content:center; transition:transform .15s;
  }
  .arrow:active{transform:scale(.9);}
  .circles-view{ width:min(78vw,300px); height:min(78vw,300px); position:relative; }
  .circle{
    position:absolute; inset:0; border-radius:50%; cursor:pointer; overflow:hidden;
    display:flex; align-items:center; justify-content:center; flex-direction:column; text-align:center;
    background:radial-gradient(circle at 35% 30%, var(--surface), var(--bg));
    border:1px solid var(--line); box-shadow:0 12px 30px rgba(60,30,40,.10);
    transition:transform .5s cubic-bezier(.22,1,.36,1), opacity .5s, box-shadow .3s;
  }
  .circle.active{ box-shadow:0 16px 40px rgba(156,107,124,.28); border-color:var(--rose); }
  .circle.pos-current{ transform:translateX(0) scale(1); opacity:1; z-index:3; }
  .circle.pos-next{ transform:translateX(62%) scale(.78); opacity:.55; z-index:2; }
  .circle.pos-prev{ transform:translateX(-62%) scale(.78); opacity:.55; z-index:2; }
  .circle.pos-hide{ transform:scale(.5); opacity:0; z-index:1; }
  .circle svg.icon{ width:34%; height:34%; stroke:var(--rose-deep); fill:none; stroke-width:1.3; margin-bottom:8px;}
  .circle .cname{ font-family:'Aref Ruqaa',serif; font-size:22px; color:var(--ink); }
  .circle .ccount{ font-size:12px; color:var(--ink-soft); margin-top:2px;}
  .dots{ display:flex; justify-content:center; gap:8px; margin:16px 0 6px;}
  .dot{ width:7px; height:7px; border-radius:50%; background:var(--line); cursor:pointer;}
  .dot.on{ background:var(--rose-deep); }

  main{ max-width:920px; margin:0 auto; padding:20px 16px 80px; }
  .section-title{ text-align:center; margin:18px 0 22px; }
  .section-title h2{ font-family:'Aref Ruqaa',serif; font-size:26px; color:var(--rose-deep); margin:0 0 4px;}
  .section-title p{ color:var(--ink-soft); font-size:13px; margin:0;}

  .grid{ display:grid; grid-template-columns:repeat(auto-fit,minmax(160px,1fr)); gap:16px; }
  .card{
    background:var(--surface); border:1px solid var(--line); border-radius:22px; padding:16px 12px 14px;
    display:flex; flex-direction:column; align-items:center; text-align:center;
  }
  .card .stage{ width:100%; aspect-ratio:3/4; display:flex; align-items:center; justify-content:center; margin-bottom:10px;}
  .card svg.garment{ width:70%; height:95%; }
  .card h3{ font-size:14.5px; margin:2px 0 2px; font-weight:500;}
  .card .price{ color:var(--rose-deep); font-size:13px; margin-bottom:10px;}
  .add-btn{
    border:1px solid var(--rose); background:transparent; color:var(--rose-deep); border-radius:20px;
    padding:8px 18px; font-family:'Tajawal',sans-serif; font-size:13px; cursor:pointer; width:100%;
  }
  .add-btn:active{ background:var(--rose); color:#fff; }

  .cart-overlay{
    position:fixed; inset:0; background:rgba(30,20,24,.35); z-index:60; opacity:0; pointer-events:none; transition:opacity .25s;
  }
  .cart-overlay.open{ opacity:1; pointer-events:auto; }
  .cart-panel{
    position:fixed; top:0; bottom:0; left:0; width:min(340px,88vw); background:var(--surface); z-index:61;
    transform:translateX(-100%); transition:transform .3s cubic-bezier(.22,1,.36,1);
    padding:calc(20px + env(safe-area-inset-top,0px)) 18px 18px; display:flex; flex-direction:column;
  }
  .cart-panel.open{ transform:translateX(0); }
  .cart-panel h2{ font-family:'Aref Ruqaa',serif; color:var(--rose-deep); margin:0 0 14px;}
  .cart-items{ flex:1; overflow-y:auto; display:flex; flex-direction:column; gap:12px;}
  .cart-empty{ color:var(--ink-soft); font-size:13px; text-align:center; margin-top:30px;}
  .cart-item{ display:flex; align-items:center; gap:10px; border-bottom:1px solid var(--line); padding-bottom:10px;}
  .cart-item .mini{ width:44px; height:56px; flex:0 0 auto;}
  .cart-item .ci-info{ flex:1;}
  .cart-item .ci-info h4{ margin:0 0 3px; font-size:13.5px; font-weight:500;}
  .qty{ display:flex; align-items:center; gap:8px; font-size:13px;}
  .qty button{ width:22px; height:22px; border-radius:50%; border:1px solid var(--line); background:var(--bg); cursor:pointer;}
  .remove{ background:none; border:none; color:var(--ink-soft); font-size:12px; text-decoration:underline; cursor:pointer; padding:0;}
  .cart-total{ display:flex; justify-content:space-between; font-size:14px; margin:14px 0; padding-top:10px; border-top:1px solid var(--line);}
  .checkout-btn{
    width:100%; padding:13px; border:none; border-radius:24px; background:var(--rose-deep); color:#fff;
    font-family:'Tajawal',sans-serif; font-size:14px; cursor:pointer;
  }
  .close-cart{ position:absolute; top:calc(16px + env(safe-area-inset-top,0px)); left:16px; background:none; border:none; font-size:20px; color:var(--ink-soft); cursor:pointer;}

  .toast{
    position:fixed; bottom:calc(24px + env(safe-area-inset-bottom,0px)); left:50%; transform:translateX(-50%) translateY(20px);
    background:var(--ink); color:var(--bg); padding:12px 20px; border-radius:16px; font-size:13.5px; z-index:80;
    opacity:0; transition:opacity .25s, transform .25s; max-width:85vw; text-align:center;
  }
  .toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }
  footer{ text-align:center; padding:20px; color:var(--ink-soft); font-size:12px;}
</style>
</head>
<body>

<button class="cart-btn" id="cartBtn" aria-label="السلة">
  <svg viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M4 6h2l1.6 10.4a2 2 0 0 0 2 1.6h7.3a2 2 0 0 0 2-1.6L20 8H6.6"/><circle cx="10" cy="21" r="1"/><circle cx="17" cy="21" r="1"/></svg>
  <span class="cart-count" id="cartCount" style="display:none;">0</span>
</button>

<header>
  <div class="brand">QUALITA</div>
  <h1>قوليتا للأناقة المحتشمة</h1>
  <p class="sub">تصاميم عصرية بلمسة هادئة، من إصدال المرأة إلى إصدال الطفلة</p>
</header>

<div class="carousel-wrap">
  <button class="arrow" id="prevArrow" aria-label="السابق">‹</button>
  <div class="circles-view" id="circlesView"></div>
  <button class="arrow" id="nextArrow" aria-label="التالي">›</button>
</div>
<div class="dots" id="dots"></div>

<main>
  <div class="section-title">
    <h2 id="sectionTitle"></h2>
    <p id="sectionSub"></p>
  </div>
  <div class="grid" id="productGrid"></div>
</main>

<footer>© Qualita — الأناقة المحتشمة</footer>

<div class="cart-overlay" id="overlay"></div>
<div class="cart-panel" id="cartPanel">
  <button class="close-cart" id="closeCart">×</button>
  <h2>سلة المشتريات</h2>
  <div class="cart-items" id="cartItems"></div>
  <div class="cart-total"><span>الإجمالي</span><span id="cartTotal">0 ر.س</span></div>
  <button class="checkout-btn" id="checkoutBtn">إتمام الطلب</button>
</div>
<div class="toast" id="toast"></div>

<script>
// ---------- garment SVG (shared silhouette, tinted per product) ----------
function garmentSVG(color, pattern){
  return `<svg class="garment" viewBox="0 0 100 130" xmlns="http://www.w3.org/2000/svg">
    <path d="M50 8 C42 8 36 14 36 21 L30 34 L14 46 L22 58 L32 50 L28 122 L72 122 L68 50 L78 58 L86 46 L70 34 L64 21 C64 14 58 8 50 8 Z"
      fill="${color}" stroke="${color==='#fff'||color==='#F7EFE9'?'#C9B7BE':'none'}" stroke-width="1"/>
    ${pattern==='dot' ? `<g fill="rgba(255,255,255,.55)"><circle cx="40" cy="70" r="2"/><circle cx="58" cy="80" r="2"/><circle cx="46" cy="95" r="2"/><circle cx="60" cy="60" r="2"/></g>` : ''}
    ${pattern==='line' ? `<g stroke="rgba(255,255,255,.5)" stroke-width="1.5"><line x1="30" y1="65" x2="70" y2="65"/><line x1="28" y1="85" x2="72" y2="85"/><line x1="30" y1="105" x2="70" y2="105"/></g>` : ''}
  </svg>`;
}
function circleIconSVG(){
  return `<svg class="icon" viewBox="0 0 100 130" xmlns="http://www.w3.org/2000/svg">
    <path d="M50 8 C42 8 36 14 36 21 L30 34 L14 46 L22 58 L32 50 L28 122 L72 122 L68 50 L78 58 L86 46 L70 34 L64 21 C64 14 58 8 50 8 Z" />
  </svg>`;
}

const categories = [
  {
    id:'women', name:'إصدال النساء', sub:'قصّات فضفاضة بتفاصيل ناعمة تناسب الحياة اليومية',
    products:[
      {name:'إصدال الياسمين', price:320, color:'#D9C3A9', pattern:''},
      {name:'إصدال السكينة', price:295, color:'#9C6B7C', pattern:'line'},
      {name:'إصدال الوردة', price:340, color:'#C99BAA', pattern:'dot'},
      {name:'إصدال الفجر', price:310, color:'#3E2F35', pattern:'line'},
    ]
  },
  {
    id:'kids', name:'إصدال الأطفال', sub:'مقاسات صغيرة بنفس الرقّة، لخطواتها الأولى في الحشمة',
    products:[
      {name:'إصدال البراعم', price:150, color:'#E7C6CE', pattern:'dot'},
      {name:'إصدال النجمة', price:140, color:'#BB9964', pattern:''},
      {name:'إصدال القمر', price:160, color:'#C99BAA', pattern:'line'},
    ]
  }
];

let current = 0;
let cart = []; // {id, name, price, color, qty}

// ---------- audio click cue ----------
let actx;
function playChime(){
  try{
    actx = actx || new (window.AudioContext||window.webkitAudioContext)();
    const t = actx.currentTime;
    [660, 880].forEach((freq,i)=>{
      const o = actx.createOscillator(); const g = actx.createGain();
      o.type='sine'; o.frequency.value=freq;
      g.gain.setValueAtTime(0.0001, t+i*0.09);
      g.gain.exponentialRampToValueAtTime(0.09, t+i*0.09+0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, t+i*0.09+0.28);
      o.connect(g); g.connect(actx.destination);
      o.start(t+i*0.09); o.stop(t+i*0.09+0.3);
    });
  }catch(e){}
}

// ---------- circles ----------
const circlesView = document.getElementById('circlesView');
const dotsEl = document.getElementById('dots');

function renderCircles(){
  circlesView.innerHTML = categories.map((c,i)=>{
    let pos = i===current ? 'pos-current' : (i===(current+1)%categories.length ? 'pos-next' : (i===(current-1+categories.length)%categories.length ? 'pos-prev' : 'pos-hide'));
    if(categories.length===2 && i!==current) pos='pos-next';
    return `<div class="circle ${pos} ${i===current?'active':''}" data-i="${i}">
      ${circleIconSVG()}
      <div class="cname">${c.name}</div>
      <div class="ccount">${c.products.length} تصاميم</div>
    </div>`;
  }).join('');
  dotsEl.innerHTML = categories.map((c,i)=>`<div class="dot ${i===current?'on':''}" data-i="${i}"></div>`).join('');
  document.querySelectorAll('.circle').forEach(el=>{
    el.addEventListener('click', ()=>{
      const i = +el.dataset.i;
      playChime();
      current = i;
      renderCircles();
      renderProducts();
    });
  });
  document.querySelectorAll('.dot').forEach(el=>{
    el.addEventListener('click', ()=>{ current = +el.dataset.i; playChime(); renderCircles(); renderProducts(); });
  });
}

document.getElementById('prevArrow').addEventListener('click', ()=>{
  current = (current-1+categories.length)%categories.length; playChime(); renderCircles(); renderProducts();
});
document.getElementById('nextArrow').addEventListener('click', ()=>{
  current = (current+1)%categories.length; playChime(); renderCircles(); renderProducts();
});

// ---------- products ----------
function renderProducts(){
  const cat = categories[current];
  document.getElementById('sectionTitle').textContent = cat.name;
  document.getElementById('sectionSub').textContent = cat.sub;
  document.getElementById('productGrid').innerHTML = cat.products.map((p,i)=>`
    <div class="card">
      <div class="stage">${garmentSVG(p.color,p.pattern)}</div>
      <h3>${p.name}</h3>
      <div class="price">${p.price} ر.س</div>
      <button class="add-btn" data-cat="${cat.id}" data-i="${i}">أضف إلى السلة</button>
    </div>
  `).join('');
  document.querySelectorAll('.add-btn').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const catObj = categories.find(c=>c.id===btn.dataset.cat);
      const prod = catObj.products[+btn.dataset.i];
      addToCart(catObj.id, prod);
      showToast(`تمت إضافة «${prod.name}» إلى السلة`);
    });
  });
}

// ---------- cart ----------
function addToCart(catId, prod){
  const key = catId+'-'+prod.name;
  const existing = cart.find(it=>it.key===key);
  if(existing){ existing.qty++; }
  else{ cart.push({key, name:prod.name, price:prod.price, color:prod.color, pattern:prod.pattern, qty:1}); }
  renderCart();
}
function renderCart(){
  const total = cart.reduce((s,it)=>s+it.price*it.qty,0);
  const count = cart.reduce((s,it)=>s+it.qty,0);
  const countEl = document.getElementById('cartCount');
  countEl.textContent = count;
  countEl.style.display = count>0 ? 'flex' : 'none';
  document.getElementById('cartTotal').textContent = total + ' ر.س';
  const itemsEl = document.getElementById('cartItems');
  if(cart.length===0){
    itemsEl.innerHTML = '<div class="cart-empty">السلة فارغة حتى الآن</div>';
    return;
  }
  itemsEl.innerHTML = cart.map(it=>`
    <div class="cart-item">
      <div class="mini">${garmentSVG(it.color,it.pattern)}</div>
      <div class="ci-info">
        <h4>${it.name}</h4>
        <div class="qty">
          <button data-act="dec" data-key="${it.key}">−</button>
          <span>${it.qty}</span>
          <button data-act="inc" data-key="${it.key}">+</button>
          <button class="remove" data-act="rm" data-key="${it.key}">إزالة</button>
        </div>
      </div>
      <div>${it.price*it.qty} ر.س</div>
    </div>
  `).join('');
  itemsEl.querySelectorAll('button[data-act]').forEach(b=>{
    b.addEventListener('click', ()=>{
      const it = cart.find(x=>x.key===b.dataset.key);
      if(b.dataset.act==='inc') it.qty++;
      if(b.dataset.act==='dec'){ it.qty--; if(it.qty<=0) cart = cart.filter(x=>x.key!==it.key); }
      if(b.dataset.act==='rm') cart = cart.filter(x=>x.key!==it.key);
      renderCart();
    });
  });
}

const overlay = document.getElementById('overlay');
const cartPanel = document.getElementById('cartPanel');
function openCart(){ overlay.classList.add('open'); cartPanel.classList.add('open'); }
function closeCartFn(){ overlay.classList.remove('open'); cartPanel.classList.remove('open'); }
document.getElementById('cartBtn').addEventListener('click', openCart);
document.getElementById('closeCart').addEventListener('click', closeCartFn);
overlay.addEventListener('click', closeCartFn);

document.getElementById('checkoutBtn').addEventListener('click', ()=>{
  showToast('الرجاء إرسال لقطة شاشة من الطلب لإتمام الشراء');
});

function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(showToast._h);
  showToast._h = setTimeout(()=>t.classList.remove('show'), 2600);
}

renderCircles();
renderProducts();
renderCart();
</script>
</body>
</html>
